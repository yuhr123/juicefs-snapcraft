name: Promote Snap to stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version currently published to latest/edge (for example, 1.4.0)
        required: true
        type: string

concurrency:
  group: snapcraft-stable-promotion
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    name: Promote ${{ inputs.version }} to stable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: snapcraft-stable

    steps:
      - name: Verify edge versions
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          channel_map="$(
            curl --fail --silent --show-error \
              --header 'Snap-Device-Series: 16' \
              https://api.snapcraft.io/v2/snaps/info/juicefs
          )"

          for arch in amd64 arm64; do
            actual_version="$(
              jq --arg arch "$arch" --raw-output '
                .["channel-map"][]
                | select(.channel.track == "latest")
                | select(.channel.risk == "edge")
                | select(.channel.architecture == $arch)
                | .version
              ' <<<"$channel_map"
            )"

            if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
              echo "Expected latest/edge for $arch to be $EXPECTED_VERSION, got ${actual_version:-<missing>}" >&2
              exit 1
            fi

            echo "Verified latest/edge for $arch: $actual_version"
          done

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Verify Snap Store credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft whoami

      - name: Show channels before promotion
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft status juicefs

      - name: Promote edge build set to stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          snapcraft promote juicefs \
            --from-channel latest/edge \
            --to-channel latest/stable \
            --yes

      - name: Show channels after promotion
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft status juicefs
