name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p '*_test.py' -v

      - name: Validate current recipe
        run: |
          version="$(sed -n -E 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' snap/snapcraft.yaml)"
          python3 -m scripts.release update-recipe \
            --recipe snap/snapcraft.yaml \
            --version "$version"
          git diff --exit-code -- snap/snapcraft.yaml
